name: Deploy to Production on merge

on:
  push:
    branches:
      - main
    # Skip runs that only change CI or docs. Keep this list the same in every
    # Checkpoint workflow (checkpoint-meta CLAUDE.md, "CI skips unchanged
    # code"). Lines starting with ! drop paths; later ones add a path back.
    # A change to this workflow or a shared action still starts it, but the
    # `changes` job below then deploys staging only.
    paths:
      - '**'
      - '!.github/**'
      - '!**/*.md'
      - '!docs/**'
      - '!.claude/**'
      - '!.idea/**'
      - '!.vscode/**'
      - '.github/workflows/firebase-hosting-merge.yml'
      - '.github/actions/**'
  # Manual deploy, for CI-only changes the push filter skipped. Production
  # can only be deployed from main; staging from any branch.
  workflow_dispatch:
    inputs:
      target:
        description: Where to deploy
        required: true
        default: staging
        type: choice
        options:
          - staging
          - production
          - both

jobs:
  # Decides which deploys run. On a push the workflow only starts when the app
  # or this deploy's CI files changed (see `paths` above); production runs
  # only if the app itself changed. Anything unexpected (unknown `before`,
  # failed fetch) deploys both, as before this job existed.
  changes:
    runs-on: ubuntu-latest
    outputs:
      production: ${{ steps.decide.outputs.production }}
      staging: ${{ steps.decide.outputs.staging }}
    steps:
      - uses: actions/checkout@v4

      - id: decide
        env:
          EVENT: ${{ github.event_name }}
          TARGET: ${{ inputs.target }}
          BEFORE: ${{ github.event.before }}
          # Same paths the `paths` filter drops, as a regex.
          NOT_APP: '^\.github/|\.md$|^docs/|^\.claude/|^\.idea/|^\.vscode/'
        run: |
          production=true
          staging=true
          if [ "$EVENT" = workflow_dispatch ]; then
            case "$TARGET" in
              staging)    production=false ;;
              production) staging=false ;;
            esac
            if [ "$production" = true ] && [ "$GITHUB_REF" != "refs/heads/main" ]; then
              echo "::error::Production can only be deployed from main, but this run is on $GITHUB_REF. Pick main under \"Use workflow from\", or deploy staging only."
              exit 1
            fi
            reason="manual run: $TARGET"
          elif [ -n "$BEFORE" ] && [ "$BEFORE" != 0000000000000000000000000000000000000000 ] \
              && git fetch -q --depth=1 origin "$BEFORE"; then
            if git diff --name-only "$BEFORE" HEAD | grep -vE "$NOT_APP" | grep -q .; then
              reason="app files changed"
            else
              production=false
              reason="only CI files changed: staging deploys, production is skipped"
            fi
          else
            reason="could not diff against the previous commit, deploying both"
          fi
          echo "production=$production" >> "$GITHUB_OUTPUT"
          echo "staging=$staging" >> "$GITHUB_OUTPUT"
          echo "Deploy production: $production, staging: $staging ($reason)" | tee -a "$GITHUB_STEP_SUMMARY"

  build_and_deploy:
    needs: changes
    if: needs.changes.outputs.production == 'true'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - run: npx vue-tsc --build --force

      - run: npx vite build
        env:
          VITE_API_URL: /api
          VITE_FIREBASE_API_KEY: ${{ vars.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ vars.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ vars.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ vars.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ vars.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ vars.VITE_FIREBASE_APP_ID }}
          VITE_SENTRY_DSN: ${{ vars.VITE_SENTRY_DSN }}

      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_CHECKPOINT_A9 }}
          channelId: live
          projectId: checkpoint-a9
          target: production

      # if: always() so a failed deploy notifies too, not just successes.
      # Requires a SLACK_BOT_TOKEN secret (chat:write scope, bot invited to
      # #deploys) — see checkpoint-meta's CI/CD plan doc for setup notes.
      - name: Notify Slack
        if: always()
        uses: ./.github/actions/notify-deploy
        with:
          app: guest-portal
          app_emoji: hotel
          environment: production
          result: ${{ job.status }}
          slack_bot_token: ${{ secrets.SLACK_BOT_TOKEN }}

  deploy_staging_persistent:
    needs: changes
    if: needs.changes.outputs.staging == 'true'
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - run: npx vue-tsc --build --force

      - run: npx vite build --mode staging
        env:
          VITE_API_URL: /api
          VITE_FIREBASE_API_KEY: ${{ vars.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ vars.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ vars.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ vars.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ vars.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ vars.VITE_FIREBASE_APP_ID }}
          VITE_SENTRY_DSN: ${{ vars.VITE_SENTRY_DSN }}

      # Persistent (channelId: live), not an ephemeral preview channel —
      # main always reflects the latest merged staging build.
      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_OFRULES_CHECKPOINT_STAGING }}
          channelId: live
          projectId: ofrules-checkpoint-staging
          target: staging

      # Same #deploys message as the production job, labelled STAGING.
      - name: Notify Slack
        if: always()
        uses: ./.github/actions/notify-deploy
        with:
          app: guest-portal
          app_emoji: hotel
          environment: staging
          result: ${{ job.status }}
          slack_bot_token: ${{ secrets.SLACK_BOT_TOKEN }}

  cleanup_pr_preview_channels:
    needs: [build_and_deploy, deploy_staging_persistent]
    # Runs when neither deploy failed, including when production was skipped.
    # Only on a merge: a manual run has no merged PR to clean up after.
    if: ${{ github.event_name == 'push' && !cancelled() && !contains(needs.*.result, 'failure') }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      # A merge commit's message contains "(#123)" for both a squash merge
      # and a merge commit; a fast-forward/rebase merge won't, so this is
      # best-effort — no PR number found just means nothing to clean up.
      # The message reaches the script through env, never inlined into it:
      # inlined, a quote in the message broke the step and a crafted one
      # could run commands in a job that later handles both service accounts.
      - id: pr_number
        env:
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          number=$(printf '%s\n' "$COMMIT_MESSAGE" | grep -oP '(?<=\(#)\d+(?=\)$)' | head -1)
          echo "number=$number" >> "$GITHUB_OUTPUT"

      - if: steps.pr_number.outputs.number != ''
        run: npm install -g firebase-tools

      - if: steps.pr_number.outputs.number != ''
        run: |
          echo "$STAGING_CREDS" > /tmp/staging-sa.json
          GOOGLE_APPLICATION_CREDENTIALS=/tmp/staging-sa.json \
            firebase hosting:channel:delete "${{ steps.pr_number.outputs.number }}" \
            --project ofrules-checkpoint-staging --target staging --force || true
          rm -f /tmp/staging-sa.json
        env:
          STAGING_CREDS: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_OFRULES_CHECKPOINT_STAGING }}

      - if: steps.pr_number.outputs.number != ''
        run: |
          echo "$PROD_CREDS" > /tmp/prod-sa.json
          GOOGLE_APPLICATION_CREDENTIALS=/tmp/prod-sa.json \
            firebase hosting:channel:delete "${{ steps.pr_number.outputs.number }}" \
            --project checkpoint-a9 --target production --force || true
          rm -f /tmp/prod-sa.json
        env:
          PROD_CREDS: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_CHECKPOINT_A9 }}

  notify_dashboard:
    needs: [build_and_deploy, deploy_staging_persistent, cleanup_pr_preview_channels]
    if: always()
    runs-on: ubuntu-latest
    steps:
      # Runs after preview-channel cleanup so the dashboard's open-PR list
      # reflects the just-merged PR's channel being gone, not just the new
      # main deploy. Requires CHECKPOINT_META_DISPATCH_TOKEN (see
      # firebase-hosting-pull-request.yml for details).
      - name: Trigger deploy-status dashboard refresh
        run: gh workflow run refresh-deploy-status.yml --repo ofrules/checkpoint-meta
        env:
          GH_TOKEN: ${{ secrets.CHECKPOINT_META_DISPATCH_TOKEN }}
