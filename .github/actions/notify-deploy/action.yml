name: Notify deploy
description: >-
  Post a deploy result to Slack: which app and environment, the outcome, and
  who triggered it (commit author and pusher, or the person who ran it
  manually). Meant to be copied as-is into the other Checkpoint repos so every
  #deploys message looks the same.

inputs:
  app:
    description: App name shown in the message, e.g. cloud-functions
    required: true
  app_emoji:
    description: Slack emoji name identifying the app (without colons)
    required: true
  environment:
    description: production or staging
    required: true
  result:
    description: Deploy outcome -- success, failure, cancelled or skipped
    required: true
  slack_bot_token:
    description: Bot token with chat:write, bot invited to the channel
    required: true
  channel:
    description: Slack channel
    default: deploys

runs:
  using: composite
  steps:
    # Everything that can contain user-controlled text (commit message, author,
    # branch name) reaches the script through env and is serialised with jq, so
    # a quote or newline in a commit title can't break or inject into the JSON.
    - name: Build Slack payload
      shell: bash
      env:
        APP: ${{ inputs.app }}
        APP_EMOJI: ${{ inputs.app_emoji }}
        ENVIRONMENT: ${{ inputs.environment }}
        RESULT: ${{ inputs.result }}
        CHANNEL: ${{ inputs.channel }}
        EVENT: ${{ github.event_name }}
        ACTOR: ${{ github.actor }}
        REF_NAME: ${{ github.ref_name }}
        SHA: ${{ github.sha }}
        REPO: ${{ github.repository }}
        RUN_ID: ${{ github.run_id }}
        COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
        COMMIT_AUTHOR: ${{ github.event.head_commit.author.username || github.event.head_commit.author.name }}
      run: |
        set -euo pipefail

        case "$ENVIRONMENT" in
          production) env_label=":rocket: *PRODUCTION*" ;;
          staging)    env_label=":test_tube: *STAGING*" ;;
          *)          env_label="*${ENVIRONMENT^^}*" ;;
        esac

        case "$RESULT" in
          success)   status=":white_check_mark: *success*" ;;
          failure)   status=":x: *failed*" ;;
          cancelled) status=":no_entry_sign: *cancelled*" ;;
          *)         status=":warning: *${RESULT}* (not deployed)" ;;
        esac

        # Slack mrkdwn treats & < > specially.
        escape() { sed -e 's/&/\&amp;/g' -e 's/</\&lt;/g' -e 's/>/\&gt;/g'; }

        actor="<https://github.com/${ACTOR}|${ACTOR}>"
        if [ "$EVENT" = "workflow_dispatch" ]; then
          who=":arrow_forward: Manually run by ${actor} from \`$(printf '%s' "$REF_NAME" | escape)\`"
        else
          title=$(printf '%s' "$COMMIT_MESSAGE" | head -n1 | cut -c1-100 | escape)
          who=":memo: ${title}"
          if [ -n "$COMMIT_AUTHOR" ] && [ "${COMMIT_AUTHOR,,}" != "${ACTOR,,}" ]; then
            who="${who}"$'\n'"Commit by $(printf '%s' "$COMMIT_AUTHOR" | escape) · pushed by ${actor}"
          else
            who="${who}"$'\n'"Commit and push by ${actor}"
          fi
        fi

        head="${env_label} · :${APP_EMOJI}: *${APP}* — ${status}"
        links="<https://github.com/${REPO}/commit/${SHA}|\`${SHA:0:7}\`> · <https://github.com/${REPO}/actions/runs/${RUN_ID}|run> · <https://ofrules-checkpoint-dashboard.firebaseapp.com/|dashboard>"
        fallback="${APP} ${ENVIRONMENT} deploy ${RESULT}"

        jq -n \
          --arg channel "$CHANNEL" \
          --arg text "$fallback" \
          --arg head "$head" \
          --arg who "$who" \
          --arg links "$links" \
          '{
            channel: $channel,
            text: $text,
            unfurl_links: false,
            blocks: [
              { type: "section", text: { type: "mrkdwn", text: $head } },
              { type: "section", text: { type: "mrkdwn", text: $who } },
              { type: "context", elements: [ { type: "mrkdwn", text: $links } ] }
            ]
          }' > "${RUNNER_TEMP}/slack-payload.json"

    - name: Post to Slack
      uses: slackapi/slack-github-action@v4.0.0
      with:
        method: chat.postMessage
        token: ${{ inputs.slack_bot_token }}
        payload-file-path: ${{ runner.temp }}/slack-payload.json
